name: Setup
description: pnpm + Node 22 + frozen-lockfile install. Must be preceded by actions/checkout@v6 in the calling workflow — local composite actions can't be resolved before the repo is on disk.

inputs:
  install-cli:
    description: "When 'true', also runs `pnpm setup:cli` so the `rando` binary resolves from PATH. Set for workflows that shell out to `rando`."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: 22
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - if: inputs.install-cli == 'true'
      shell: bash
      run: pnpm setup:cli
