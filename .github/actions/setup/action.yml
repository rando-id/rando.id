name: Setup
description: pnpm + Node 22 + frozen-lockfile install. Must be preceded by actions/checkout@v4 in the calling workflow — local composite actions can't be resolved before the repo is on disk.

inputs:
  install-cli:
    description: "When 'true', also runs `pnpm setup:cli` so the `rando` binary resolves from PATH. Set for workflows that shell out to `rando`."
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - shell: bash
      run: pnpm install --frozen-lockfile

    - if: inputs.install-cli == 'true'
      shell: bash
      run: pnpm setup:cli
