name: Feature request
description: Suggest a new capability or improvement.
title: '[feat]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are most useful when they describe the
        problem first, not the solution. Tell us what you're trying
        to do — we'll figure out the best shape together.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to accomplish? Why is the current behavior insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How might this work? Sketch the UX, API, or command shape if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why they're worse.

  - type: input
    id: area
    attributes:
      label: Area
      description: 'Which surface? CLI / web / admin / api / native / infra.'
      placeholder: 'cli'
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Links, screenshots, references to similar features elsewhere.

  - type: checkboxes
    id: code-of-conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](../CODE_OF_CONDUCT.md).
          required: true
