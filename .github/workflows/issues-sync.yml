name: Issues sync

# Transitions GitHub Issues (or Jira tickets when tracker.kind="jira"
# in rando.config.json) through their lifecycle based on PR events.
# Tickets are discovered by scanning the PR's commit range for
# `Refs: <KEY>` footers (added automatically by the prepare-commit-msg
# hook — see packages/cli/README.md → "issues").
#
# Events:
#   pull_request: opened, reopened, synchronize → In Progress
#   pull_request: closed (merged=true)          → Done
#
# The branch-deploy → In Review + URL-comment step lives in preview.yml,
# right next to the deploy itself.
#
# Auth: GITHUB_TOKEN is auto-provided by Actions (no repo-secret setup
# needed). For tracker.kind="jira", add JIRA_BASE_URL / JIRA_EMAIL /
# JIRA_API_TOKEN to repo secrets too.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: issues-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transition:
    name: Transition referenced issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # vars.TRACKER_ENABLED=false disables without removing the workflow.
    if: ${{ vars.TRACKER_ENABLED != 'false' }}
    permissions:
      issues: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm setup:cli

      - name: Collect issue keys from the PR's commit range
        id: refs
        run: |
          KEYS=$(rando issues refs '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          {
            echo "keys<<EOF"
            echo "$KEYS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Transition to In Progress (PR opened / synchronize / reopened)
        if: github.event.action != 'closed' && steps.refs.outputs.keys != ''
        run: |
          echo '${{ steps.refs.outputs.keys }}' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ transitioning $key to in-progress"
            rando issues lifecycle "$key" in-progress || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FORCE_COLOR: '1'

      - name: Transition to Done (PR merged)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.refs.outputs.keys != ''
        run: |
          echo '${{ steps.refs.outputs.keys }}' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ transitioning $key to done"
            rando issues lifecycle "$key" done \
              --message "Merged in #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})" \
              || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          FORCE_COLOR: '1'
