name: Dependency Review

# Gate PRs that introduce vulnerable or incompatibly-licensed deps.
# Complements Dependabot (which bumps existing deps) by catching NEW
# additions a contributor pulls in. See .notes/security-github-baseline.md.

on:
  pull_request:
    branches: [main, staging]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block PRs that add deps with high+ severity advisories. Adjust
          # downward if it becomes noisy.
          fail-on-severity: high
          # Inline summary on the PR for any blocked dep.
          comment-summary-in-pr: on-failure
          # Disallow GPL-family licenses for new deps (allow existing ones
          # via transitive). LGPL is permitted — typical use as a library
          # dependency doesn't trigger copyleft on dependents. Tune the
          # deny-list if a legitimate dep falls into this bucket.
          #
          # SPDX gotcha: bare `GPL-3.0` is deprecated; SPDX splits each
          # GPL/AGPL version into `-only` (this exact version) and
          # `-or-later` (this version or any later). SPDX says deprecated
          # forms map to `-only`, and the action SHOULD normalize, but if
          # any registry / lockfile reports the bare form and the action
          # does strict string matching, a GPL package could slip through.
          # List all three forms (bare + -only + -or-later) per family for
          # defense-in-depth — cost is zero extra entries; closes the gap.
          #
          # AGPL-1.0 is the exception — it was deprecated WITHOUT ever
          # getting the `-only` / `-or-later` split, so bare `AGPL-1.0`
          # is the only valid SPDX identifier (and practically extinct in
          # the wild — the world moved to AGPL-3.0 in 2007).
          deny-licenses: >-
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            AGPL-1.0,
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
