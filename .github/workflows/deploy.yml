name: Deploy

# Spins up a Vercel preview deploy for every PR with a stable
# `<branch-slug>-<app>.rando-id.dev` URL, and tears it down on close.
# Production + staging deploys run via Vercel's native GitHub
# integration (push to main/staging) — this workflow only covers the
# branch-deploy flow today. See MAINTAINING.md → "Deploy strategy"
# for when/why to move prod deploys here too.
#
# Secrets are resolved from a **1Password Environment** (not a Vault)
# at job start. The only GitHub repo secret you need is
# `OP_SERVICE_ACCOUNT_TOKEN`; everything else is read from the staging
# environment (`ftd3n4l5egcfjai7f7tm2f7ytq`) via `op environment read`.
#
# Items expected in the staging Environment:
#   - NEON_API_KEY            (only if RANDO_NEON_PROJECT_ID is set)
#   - VERCEL_TOKEN
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN  (only when tracker.kind=jira)
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   RANDO_NEON_PROJECT_ID   — needed only by the optional per-PR Neon branch steps
#   TRACKER_ENABLED=false   — disables the issue-tracker sync step
#   PREVIEW_ENABLED=false   — disables this whole workflow (use until the
#                             Vercel projects exist; see #75). Both branch-deploy
#                             AND teardown skip when set.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Docs-only PRs don't need a preview environment. `paths-ignore` runs
    # the workflow only when at least one changed file is OUTSIDE the
    # listed patterns — a PR mixing code + docs still triggers a deploy.
    # Safe to use here because this workflow isn't a required status
    # check (gated on `vars.PREVIEW_ENABLED`); if that ever changes,
    # switch to a path-filter step that no-ops gracefully so required
    # checks still report success on skipped PRs.
    paths-ignore:
      - '.notes/**'
      - '**/*.md'
      - 'LICENSE'

concurrency:
  # Serialize per-PR so a quick close-after-open doesn't race the deploy job.
  group: deploy-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  branch-deploy:
    if: ${{ vars.PREVIEW_ENABLED != 'false' && github.event.action != 'closed' }}
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          install-cli: 'true'

      # Stream the staging 1Password Environment into $GITHUB_ENV. Adding
      # a new secret means adding it to the Environment in the 1Password
      # UI — no workflow change required.
      - uses: ./.github/actions/op-env
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      # Optional: spin up a per-PR Neon branch off main so migrations and
      # seed data are isolated. Requires RANDO_NEON_PROJECT_ID variable.
      # - name: Create Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch create ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --from main

      - name: Trigger preview deploys
        run: rando deploy branch '${{ github.head_ref }}' --stable-url
        env:
          FORCE_COLOR: '1'

      # Issue tracker: each ticket referenced by this PR → In Review,
      # plus a comment with the per-app stable deploy URLs. Soft-fails
      # so a tracker hiccup doesn't fail the deploy job.
      - id: refs
        if: vars.TRACKER_ENABLED != 'false'
        uses: ./.github/actions/issue-refs

      - name: Sync issues → In Review with deploy URLs
        if: vars.TRACKER_ENABLED != 'false' && steps.refs.outputs.keys != ''
        run: |
          BRANCH='${{ github.head_ref }}'
          MSG=$(printf 'Branch deploy live:\n\n- https://%s-api.rando-id.dev\n- https://%s-web.rando-id.dev\n- https://%s-admin.rando-id.dev\n\nPR: %s' \
            "$BRANCH" "$BRANCH" "$BRANCH" "${{ github.event.pull_request.html_url }}")
          echo '${{ steps.refs.outputs.keys }}' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ $key in-review + comment"
            rando issues lifecycle "$key" in-review --message "$MSG" || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'

  teardown:
    if: ${{ vars.PREVIEW_ENABLED != 'false' && github.event.action == 'closed' }}
    name: Teardown preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - uses: ./.github/actions/setup
        with:
          install-cli: 'true'

      - uses: ./.github/actions/op-env
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Remove stable URLs
        run: rando deploy teardown '${{ github.head_ref }}' --yes
        env:
          FORCE_COLOR: '1'

      # Optional: drop the per-PR Neon branch.
      # - name: Delete Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch delete ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --yes
