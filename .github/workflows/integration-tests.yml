name: Integration tests

# Runs the Postman collection (postman/rando-api.postman_collection.json)
# via the official Postman CLI against a deployed API. Smart targeting
# picks the PR's preview when one is expected, falls back to staging
# otherwise — see .notes/ci-integration-tests-smart-target.spec.md.
#
# Target matrix (pull_request events):
#   - API workspace NOT affected             → skip (existing gate)
#   - API affected, human-authored           → preview URL (poll, fallback to staging)
#   - API affected, Dependabot, no label     → staging (smoke test; no polling)
#   - API affected, Dependabot, `preview`    → preview URL (poll, fallback to staging)
#
# Other events:
#   - schedule (nightly cron)                → staging
#   - workflow_dispatch with inputs.baseUrl  → that URL
#
# When the preview path falls back to staging, the workflow still
# succeeds but emits a ::warning::. The underlying deploy failure
# shows up on the `Vercel – rando-api` check and the `Deploy preview`
# workflow rollup — those are the sources of truth for deploy health,
# not this workflow.
#
# Required: `POSTMAN_API_KEY` env var (auto-loaded from the staging
# 1Password Environment via `op environment read`) — both
# `collection run` and `api lint` need it to authenticate.
#
# vars.POSTMAN_ENABLED=false disables the workflow without removing
# it (matches the issues.yml + deploy.yml pattern).

on:
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # 07:00 UTC = midnight Pacific. Cron is GitHub-side, no DST handling.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      baseUrl:
        description: 'Override target URL (defaults to staging)'
        required: false
        type: string

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Postman collection + spec lint against preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ vars.POSTMAN_ENABLED != 'false' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: ./.github/actions/setup

      - id: changes
        uses: ./.github/actions/changes

      # Skip on PR events when nothing API-relevant changed. Scheduled
      # nightly runs and workflow_dispatch always proceed — they're
      # against staging or a user-specified URL, not the PR's preview.
      - name: Skip when no API code touched
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changes.outputs.api }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Integration tests skipped::No API code (or its deps) changed in this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Resolve the target URL: preview when a preview will exist
      # (human-authored, OR Dependabot + `preview` label — same gate as
      # deploy.yml). Falls back to staging if the preview never comes
      # up (deploy failure, Vercel quota hit) so we still get a smoke
      # test instead of a misleading SUCCESS-with-skip. Spec:
      # .notes/ci-integration-tests-smart-target.spec.md
      - name: Resolve target URL
        if: steps.gate.outputs.skip != 'true'
        id: target
        run: |
          set -e
          STAGING="https://staging-api.rando-id.dev"
          if [ -n "${{ inputs.baseUrl }}" ]; then
            echo "url=${{ inputs.baseUrl }}" >> "$GITHUB_OUTPUT"
            echo "mode=dispatch" >> "$GITHUB_OUTPUT"
            echo "Target: ${{ inputs.baseUrl }} (workflow_dispatch input)"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "url=${STAGING}" >> "$GITHUB_OUTPUT"
            echo "mode=staging" >> "$GITHUB_OUTPUT"
            echo "Target: ${STAGING} (nightly cron)"
            exit 0
          fi
          # PR event with API workspace affected. Predict whether
          # deploy.yml will fire a preview using the same author +
          # label gate, then poll if so; fall back to staging on
          # timeout. The staging path skips polling entirely.
          #
          # Parity with deploy.yml: include the PREVIEW_ENABLED toggle
          # so flipping it to 'false' (used when the Vercel projects
          # don't exist yet — see deploy.yml header re: #75) routes
          # straight to staging instead of polling for a preview that
          # won't be coming.
          if [ "${{ vars.PREVIEW_ENABLED }}" = "false" ]; then
            echo "url=${STAGING}" >> "$GITHUB_OUTPUT"
            echo "mode=staging" >> "$GITHUB_OUTPUT"
            echo "Target: ${STAGING} (vars.PREVIEW_ENABLED=false; no preview will fire)"
            exit 0
          fi
          ACTOR='${{ github.actor }}'
          HAS_PREVIEW_LABEL=$(jq -e '. | index("preview")' <<<'${{ toJson(github.event.pull_request.labels.*.name) }}' >/dev/null 2>&1 && echo true || echo false)
          if [ "$ACTOR" = "dependabot[bot]" ] && [ "$HAS_PREVIEW_LABEL" != "true" ]; then
            # No preview will fire (Dependabot without label). Smoke
            # test staging instead — catches contract regressions on
            # merged main without burning 5 min of polling.
            echo "url=${STAGING}" >> "$GITHUB_OUTPUT"
            echo "mode=staging" >> "$GITHUB_OUTPUT"
            echo "Target: ${STAGING} (Dependabot PR without 'preview' label — smoke test)"
            exit 0
          fi
          # Preview is expected. Same slug logic as
          # packages/cli/src/commands/deploy.ts:slugifyBranch.
          SLUG=$(echo "${{ github.head_ref }}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')
          PREVIEW="https://${SLUG}-api.rando-id.dev"
          echo "Polling preview ${PREVIEW} for up to 5 minutes…"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "${PREVIEW}/v1/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "url=${PREVIEW}" >> "$GITHUB_OUTPUT"
              echo "mode=preview" >> "$GITHUB_OUTPUT"
              echo "Target: ${PREVIEW} (responding on attempt $i)"
              exit 0
            fi
            echo "attempt $i: ${PREVIEW}/v1/health → ${code}, retrying in 10s..."
            sleep 10
          done
          echo "::warning::Preview ${PREVIEW} never responded 200 on /v1/health within 5 minutes — falling back to ${STAGING}. Check the 'Vercel – rando-api' check / 'Deploy preview' workflow for the underlying cause."
          echo "url=${STAGING}" >> "$GITHUB_OUTPUT"
          echo "mode=staging-fallback" >> "$GITHUB_OUTPUT"

      - name: Load 1Password Environment
        if: steps.gate.outputs.skip != 'true'
        uses: ./.github/actions/op-env
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - name: Run Postman collection against target
        if: steps.gate.outputs.skip != 'true'
        env:
          BASE_URL: ${{ steps.target.outputs.url }}
          FORCE_COLOR: '1'
        run: pnpm test:api

      - name: Lint OpenAPI spec
        if: steps.gate.outputs.skip != 'true'
        env:
          SPEC_URL: ${{ steps.target.outputs.url }}/v1/openapi.json
          FORCE_COLOR: '1'
        run: pnpm spec:lint

      - name: Upload JUnit report
        if: always() && steps.gate.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postman-results
          path: test-results/postman.xml
          retention-days: 7
          if-no-files-found: ignore

      - name: Comment on PR with failures
        if: failure() && steps.gate.outputs.skip != 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs')
            let failures = 0
            let total = 0
            try {
              const xml = fs.readFileSync('test-results/postman.xml', 'utf8')
              failures = (xml.match(/<failure /g) || []).length
              total = (xml.match(/<testcase /g) || []).length
            } catch {}
            const target = '${{ steps.target.outputs.url }}'
            const mode = '${{ steps.target.outputs.mode }}'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            // Help the author distinguish "your bump broke something"
            // from "main / staging is broken and your PR ran against
            // it." The body of the comment changes based on which
            // target mode resolve-target picked.
            const modeNote =
              mode === 'staging'
                ? `> _Tested against **staging** (Dependabot smoke test — no preview deploy fires for Dependabot PRs without the \`preview\` label). Failures may reflect main's state, not this PR's bump. Check the [nightly Postman cron run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/integration-tests.yml) and recent merges before assuming this PR broke it. To target the preview instead, add the \`preview\` label and re-push._`
                : mode === 'staging-fallback'
                  ? `> _Targeted this PR's preview but it never came up; **fell back to staging**. The real deploy failure lives in the [\`Deploy preview\`](${run}) workflow rollup and the \`Vercel – rando-api\` check — that's where to look before debugging Postman failures._`
                  : mode === 'dispatch'
                    ? `> _Workflow was dispatched manually against a custom URL._`
                    : null // preview / staging (cron) — no extra note
            const body = [
              `## Integration tests failed`,
              ``,
              `**${failures} of ${total} assertion(s) failed** running the Postman collection against \`${target}\`.`,
              ...(modeNote ? [``, modeNote] : []),
              ``,
              `Full output: ${run}`,
              ``,
              `<sub>Tests live in \`postman/rando-api.postman_collection.json\` — edit there and re-push to update.</sub>`,
            ].join('\n')
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            })
