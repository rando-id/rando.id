name: CodeQL

# GitHub's native static-analysis scan. Detects TS/JS-class
# vulnerabilities (injection, XSS, hardcoded secrets, insecure
# deserialization, etc.). Free for public repos.
#
# Schedule: weekly cron + on every push to main + on every PR
# touching code. PR runs are gated on the `code` aggregate from
# the changes composite so docs-only PRs don't burn minutes.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 09:00 UTC Mondays. Aligns with Dependabot's weekly cadence —
    # the upgrade PRs that land Monday get scanned the same morning.
    - cron: '0 9 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      # Required to upload findings to the Security tab.
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # `javascript-typescript` covers every workspace's source. `actions`
        # scans the workflow YAML itself for script-injection, untrusted-
        # input, and permission issues — worth the extra job given how much
        # we lean on Actions. Append `go` etc. here if we add other runtimes.
        language: [javascript-typescript, actions]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - id: changes
        uses: ./.github/actions/changes

      # Skip on PR events when no code changed. Push to main and
      # scheduled runs always proceed.
      - name: Skip on docs-only PRs
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ steps.changes.outputs.code }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=CodeQL skipped::No code files changed in this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Initialize CodeQL
        if: steps.gate.outputs.skip != 'true'
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # Use the `security-and-quality` query suite — covers more
          # than the default `security-extended`. Adds maintainability
          # findings too; we want them.
          queries: security-and-quality
          # Custom config (paths-ignore for known false positives, etc.)
          # — see the file's header for rationale per entry.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        if: steps.gate.outputs.skip != 'true'
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: '/language:${{ matrix.language }}'
