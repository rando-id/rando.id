name: Issues

# Transitions GitHub Issues (or Jira tickets when tracker.kind="jira"
# in rando.config.json) through their lifecycle based on PR events.
# Tickets are discovered by scanning the PR's commit range for
# `Refs: <KEY>` footers (added automatically by the prepare-commit-msg
# hook — see packages/cli/README.md → "issues").
#
# Events:
#   pull_request: opened, reopened, synchronize → In Progress
#   pull_request: closed (merged=true)          → Done
#
# The branch-deploy → In Review + URL-comment step lives in deploy.yml,
# right next to the deploy itself.
#
# Auth: GITHUB_TOKEN is auto-provided by Actions. For tracker.kind="jira",
# Jira credentials are pulled from 1Password (see deploy.yml header).
# Only OP_SERVICE_ACCOUNT_TOKEN needs to be a GitHub repo secret.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: issues-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  transition:
    name: Transition referenced issues
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # vars.TRACKER_ENABLED=false disables without removing the workflow.
    if: ${{ vars.TRACKER_ENABLED != 'false' }}
    permissions:
      issues: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup
        with:
          install-cli: 'true'

      # Only stream the staging 1Password Environment when the tracker
      # config actually needs it. For GitHub Issues (the default) the
      # auto-provided GITHUB_TOKEN is enough — we don't burn a service
      # account read per PR for nothing.
      - if: vars.TRACKER_KIND == 'jira'
        uses: ./.github/actions/op-env
        with:
          service-account-token: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}

      - id: refs
        uses: ./.github/actions/issue-refs

      - name: Transition to In Progress (PR opened / synchronize / reopened)
        if: github.event.action != 'closed' && steps.refs.outputs.keys != ''
        run: |
          echo '${{ steps.refs.outputs.keys }}' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ transitioning $key to in-progress"
            rando issues lifecycle "$key" in-progress || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'

      - name: Transition to Done (PR merged)
        if: github.event.action == 'closed' && github.event.pull_request.merged == true && steps.refs.outputs.keys != ''
        run: |
          echo '${{ steps.refs.outputs.keys }}' | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ transitioning $key to done"
            rando issues lifecycle "$key" done \
              --message "Merged in #${{ github.event.pull_request.number }} (${{ github.event.pull_request.html_url }})" \
              || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'
