name: PR preview

# Spins up a Vercel preview deploy for every PR with a stable
# `<branch-slug>-<app>.rando-id.dev` URL, and tears it down on close.
#
# Secrets are resolved from a **1Password Environment** (not a Vault)
# at job start. The only GitHub repo secret you need is
# `OP_SERVICE_ACCOUNT_TOKEN` (Settings → Secrets and variables →
# Actions → New repository secret); everything else is read from the
# staging environment (`ftd3n4l5egcfjai7f7tm2f7ytq`) via
# `op environment read`, which streams `KEY=VALUE` lines that we
# append straight to `$GITHUB_ENV`.
#
# Why Environments and not Vaults: secrets are organized by deploy
# environment (local/staging/prod) on the 1Password side. The
# service account is scoped to those Environments specifically; it
# cannot read from arbitrary vaults. `op environment read` is the
# correct tool — `op read op://...` only resolves against Vaults.
#
# Items expected in the staging Environment:
#   - NEON_API_KEY            (only if RANDO_NEON_PROJECT_ID is set)
#   - VERCEL_TOKEN
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN  (only when tracker.kind=jira)
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   RANDO_NEON_PROJECT_ID   — needed only by the optional per-PR Neon branch steps
#   TRACKER_ENABLED=false   — disables the issue-tracker sync step

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # Serialize per-PR so a quick close-after-open doesn't race the preview job.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed'
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm setup:cli

      - name: Install 1Password CLI (>= 2.35 for `op environment`)
        uses: 1password/install-cli-action@v1
        with:
          version: 2.35.0-beta.01

      # Stream the staging 1Password Environment into $GITHUB_ENV. Every
      # KEY=VALUE line lands as an environment variable for subsequent
      # steps. Adding a new secret means adding it to the Environment in
      # the 1Password UI — no workflow change required.
      - name: Load secrets from 1Password Environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op environment read ftd3n4l5egcfjai7f7tm2f7ytq >> "$GITHUB_ENV"

      # Optional: spin up a per-PR Neon branch off main so migrations and
      # seed data are isolated. Requires RANDO_NEON_PROJECT_ID variable.
      # - name: Create Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch create ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --from main

      - name: Trigger preview deploys
        run: rando deploy branch '${{ github.head_ref }}' --stable-url --yes
        env:
          FORCE_COLOR: '1'

      # Issue tracker: each ticket referenced by this PR → In Review,
      # plus a comment with the per-app stable deploy URLs. Soft-fails
      # so a tracker hiccup doesn't fail the preview job.
      - name: Sync issues → In Review with deploy URLs
        if: vars.TRACKER_ENABLED != 'false'
        run: |
          KEYS=$(rando issues refs '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          if [ -z "$KEYS" ]; then
            echo "(no issue refs found in PR commits)"
            exit 0
          fi
          BRANCH='${{ github.head_ref }}'
          MSG=$(printf 'Branch deploy live:\n\n- https://%s-api.rando-id.dev\n- https://%s-web.rando-id.dev\n- https://%s-admin.rando-id.dev\n\nPR: %s' \
            "$BRANCH" "$BRANCH" "$BRANCH" "${{ github.event.pull_request.html_url }}")
          echo "$KEYS" | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ $key in-review + comment"
            rando issues lifecycle "$key" in-review --message "$MSG" || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'

  teardown:
    if: github.event.action == 'closed'
    name: Teardown preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm setup:cli

      - name: Install 1Password CLI (>= 2.35 for `op environment`)
        uses: 1password/install-cli-action@v1
        with:
          version: 2.35.0-beta.01

      - name: Load secrets from 1Password Environment
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: op environment read ftd3n4l5egcfjai7f7tm2f7ytq >> "$GITHUB_ENV"

      - name: Remove stable URLs
        run: rando deploy teardown '${{ github.head_ref }}' --yes
        env:
          FORCE_COLOR: '1'

      # Optional: drop the per-PR Neon branch.
      # - name: Delete Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch delete ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --yes
