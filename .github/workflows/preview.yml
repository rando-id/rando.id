name: PR preview

# Spins up a Vercel preview deploy for every PR with a stable
# `<branch-slug>-<app>.rando-id.dev` URL, and tears it down on close.
#
# Secrets are resolved from 1Password at job start via the official
# load-secrets-action — the only GitHub repo secret you need is
# `OP_SERVICE_ACCOUNT_TOKEN` (Settings → Secrets and variables →
# Actions → New repository secret). Everything else lives in the
# **staging** 1P vault (ftd3n4l5egcfjai7f7tm2f7ytq) following the
# convention from rando.config.json: item title === env var name,
# field === "credential". The service account needs read access to
# the staging vault; production-bound workflows would use a different
# vault entirely.
#
# Items expected in the staging vault:
#   - NEON_API_KEY            (only if RANDO_NEON_PROJECT_ID is set)
#   - VERCEL_TOKEN
#   - CLOUDFLARE_API_TOKEN
#   - CLOUDFLARE_ACCOUNT_ID
#   - JIRA_BASE_URL / JIRA_EMAIL / JIRA_API_TOKEN  (only when tracker.kind=jira)
#
# Optional repo variables (Settings → Secrets and variables → Actions → Variables):
#   RANDO_NEON_PROJECT_ID   — needed only by the optional per-PR Neon branch steps
#   TRACKER_ENABLED=false   — disables the issue-tracker sync step

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  # Serialize per-PR so a quick close-after-open doesn't race the preview job.
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  preview:
    if: github.event.action != 'closed'
    name: Deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm setup:cli

      # Pull secrets from 1Password into env vars for the remaining
      # steps. References use the same convention as `rando secrets
      # sync` — vault "Rando", item title === var name, field
      # "credential". Add a line + a new vault item to expose more.
      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VERCEL_TOKEN: op://ftd3n4l5egcfjai7f7tm2f7ytq/VERCEL_TOKEN/credential
          CLOUDFLARE_API_TOKEN: op://ftd3n4l5egcfjai7f7tm2f7ytq/CLOUDFLARE_API_TOKEN/credential
          CLOUDFLARE_ACCOUNT_ID: op://ftd3n4l5egcfjai7f7tm2f7ytq/CLOUDFLARE_ACCOUNT_ID/credential
          # Tracker creds — optional, only consumed by the issue-sync
          # step below when tracker.kind=jira. GitHub Issues uses the
          # auto-provided GITHUB_TOKEN, not these.
          JIRA_BASE_URL: op://ftd3n4l5egcfjai7f7tm2f7ytq/JIRA_BASE_URL/credential
          JIRA_EMAIL: op://ftd3n4l5egcfjai7f7tm2f7ytq/JIRA_EMAIL/credential
          JIRA_API_TOKEN: op://ftd3n4l5egcfjai7f7tm2f7ytq/JIRA_API_TOKEN/credential

      # Optional: spin up a per-PR Neon branch off main so migrations and
      # seed data are isolated. Requires RANDO_NEON_PROJECT_ID variable.
      # - name: Create Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch create ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --from main

      - name: Trigger preview deploys
        run: rando deploy branch '${{ github.head_ref }}' --stable-url --yes
        env:
          FORCE_COLOR: '1'

      # Issue tracker: each ticket referenced by this PR → In Review,
      # plus a comment with the per-app stable deploy URLs. Soft-fails
      # so a tracker hiccup doesn't fail the preview job.
      - name: Sync issues → In Review with deploy URLs
        if: vars.TRACKER_ENABLED != 'false'
        run: |
          KEYS=$(rando issues refs '${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}')
          if [ -z "$KEYS" ]; then
            echo "(no issue refs found in PR commits)"
            exit 0
          fi
          BRANCH='${{ github.head_ref }}'
          MSG=$(printf 'Branch deploy live:\n\n- https://%s-api.rando-id.dev\n- https://%s-web.rando-id.dev\n- https://%s-admin.rando-id.dev\n\nPR: %s' \
            "$BRANCH" "$BRANCH" "$BRANCH" "${{ github.event.pull_request.html_url }}")
          echo "$KEYS" | while IFS= read -r key; do
            [ -z "$key" ] && continue
            echo "→ $key in-review + comment"
            rando issues lifecycle "$key" in-review --message "$MSG" || echo "(non-fatal: $key)"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_COLOR: '1'

  teardown:
    if: github.event.action == 'closed'
    name: Teardown preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm setup:cli

      - name: Load secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          VERCEL_TOKEN: op://ftd3n4l5egcfjai7f7tm2f7ytq/VERCEL_TOKEN/credential
          CLOUDFLARE_API_TOKEN: op://ftd3n4l5egcfjai7f7tm2f7ytq/CLOUDFLARE_API_TOKEN/credential
          CLOUDFLARE_ACCOUNT_ID: op://ftd3n4l5egcfjai7f7tm2f7ytq/CLOUDFLARE_ACCOUNT_ID/credential

      - name: Remove stable URLs
        run: rando deploy teardown '${{ github.head_ref }}' --yes
        env:
          FORCE_COLOR: '1'

      # Optional: drop the per-PR Neon branch.
      # - name: Delete Neon branch
      #   if: vars.RANDO_NEON_PROJECT_ID != ''
      #   run: rando db branch delete ${{ vars.RANDO_NEON_PROJECT_ID }} pr-${{ github.event.pull_request.number }} --yes
