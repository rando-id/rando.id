packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# Catalog layout: the default catalog holds truly cross-cutting deps
# with no sibling cluster (typescript, @types/node, tsx, zod). Each
# framework with sibling-package potential lives in its own named
# catalog so:
#
#   1. Lockstep is structural (bumping any member forces bumping the
#      others — most relevant for tamagui + vitest today).
#   2. Future sibling packages (@clerk/themes, @next/*, etc.) drop
#      into the right block without reorg.
#   3. Per-catalog version policy is possible — could freeze one
#      framework while bumping others.
#
# Per-workspace overrides remain valid for cases where the catalog
# version doesn't fit — e.g. apps/native pinning `~5.7.2` for React
# Native compat, packages/cli on `^10.5.0` for ESLint while the
# React-side plugin ecosystem catches up (#224).
catalog:
  # Type checker — most workspaces use the catalog; apps/native pins
  # `~5.7.2` outside the catalog for React Native compat.
  typescript: ^6.0.3

  # Standalone tools, no sibling clusters today.
  '@types/node': ^22.10.2
  tsx: ^4.22.4

  # Schema validation — 5 consumer workspaces. Runtime dep, version
  # drift would mean two schemas can't share a parser type.
  zod: ^3.25.76

# Named catalogs group deps that MUST move together OR have a known
# sibling-package roadmap that makes a named block future-proof.
catalogs:
  # Test runner + coverage + UI — three packages that share internal
  # types and break across major boundaries. All three at the same
  # version, always.
  vitest:
    vitest: ^3.2.6
    '@vitest/coverage-v8': ^3.2.6
    '@vitest/ui': ^3.2.6

  # Lint. Currently just `eslint` itself, but the plugin ecosystem
  # (eslint-plugin-*) tends to lockstep with the major. Named catalog
  # so future plugin catalog entries drop in cleanly — packages/cli
  # stays on `^10.5.0` outside this catalog until eslint-plugin-react
  # v8 ships (see #224).
  eslint:
    eslint: ^9.39.4

  # React typings — must lockstep with the runtime React major. (The
  # runtime react + react-dom live in pnpm.overrides for transitive
  # dedup; they belong here once that override is reconciled — see
  # #228.)
  react:
    '@types/react': ^19.0.2
    '@types/react-dom': ^19.0.2

  # Tamagui ecosystem — a tamagui v2 won't load v1 config / plugin /
  # theme and vice versa. Bumping is one PR editing this block.
  tamagui:
    tamagui: ^2.4.0
    '@tamagui/config': ^2.4.0
    '@tamagui/next-theme': ^2.4.0
    '@tamagui/next-plugin': ^2.4.0
    '@tamagui/babel-plugin': ^2.4.0

  # Clerk auth — apps/admin, apps/api, apps/web consume @clerk/nextjs
  # today. Named catalog future-proofs for @clerk/themes, @clerk/clerk-js,
  # @clerk/types as those get adopted. Kept on v6 until a deliberate
  # v7 migration spec lands.
  clerk:
    '@clerk/nextjs': ^6.10.0

  # React Query — apps/web + apps/native consume the core package.
  # Named catalog future-proofs for @tanstack/query-core, react-query
  # devtools, etc.
  react-query:
    '@tanstack/react-query': ^5.101.0
