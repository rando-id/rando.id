packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# Cross-cutting dev deps live in catalog so a bump is one PR editing
# one line, not 16 PRs cascading through the lockfile. See
# .notes/tech-pnpm-catalog.spec.md (Phase 1).
#
# Per-workspace overrides remain valid for cases where the catalog
# version doesn't fit — e.g. apps/native pinning `~5.7.2` for React
# Native compat, packages/cli on `^10.5.0` for ESLint while the
# React-side plugin ecosystem catches up (#224).
catalog:
  # Type checker — most workspaces are on TS 6 after the 2026-06-25
  # bump; apps/native keeps its tilde-pinned 5.7.x outside the catalog.
  typescript: ^6.0.3

  # Test runner + coverage — must move in lockstep.
  vitest: ^2.1.9
  '@vitest/coverage-v8': ^2.1.9

  # Lint + Node typings.
  eslint: ^9.39.4
  '@types/node': ^22.10.2

  # TypeScript script runner.
  tsx: ^4.22.4

  # React typings — kept in catalog because every React-using
  # workspace needs them in lockstep with the runtime React version.
  '@types/react': ^19.0.2
  '@types/react-dom': ^19.0.2
